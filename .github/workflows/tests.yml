name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# No MySQL, .env, Reverb or Node: phpunit.xml runs the suite on in-memory
# sqlite with its own APP_KEY, sync queue and null broadcaster. Never set
# DB_* or APP_ENV here: PHPUnit doesn't overwrite an env var that is already
# set, and Tests\TestCase then fails every test.

jobs:
  pint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, xml, xmlwriter, curl, fileinfo, openssl, tokenizer, ctype
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: vendor/bin/pint --test

  tests:
    runs-on: ubuntu-latest
    env:
      DDS_TEST_LIBRARY: /usr/lib/x86_64-linux-gnu/libdds.so.0
    steps:
      - uses: actions/checkout@v7

      # coverage: none keeps Xdebug off, which is most of the local run time.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, sqlite3, mbstring, dom, xml, xmlwriter, curl, fileinfo, openssl, tokenizer, ctype, ffi
          coverage: none
          tools: composer:v2

      # the DDS library, so tests/Unit/DdsSolverTest runs the real double
      # dummy solver through FFI (DDS_TEST_LIBRARY); the rest of the suite
      # uses a fake and never loads it
      - run: sudo apt-get update && sudo apt-get install -y libdds0

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: composer install --no-interaction --prefer-dist --no-progress

      # Plain phpunit: with no .env, `php artisan test` prints a harmless
      # Dotenv warning per test.
      - run: vendor/bin/phpunit

  # The suite again, with pcov (much faster than Xdebug) collecting line
  # coverage of app/. scripts/coverage.php puts the per-directory summary in
  # the job summary and fails the job under the floor (95% of lines); the
  # HTML report is uploaded as the `coverage-html` artifact, per file.
  coverage:
    runs-on: ubuntu-latest
    env:
      DDS_TEST_LIBRARY: /usr/lib/x86_64-linux-gnu/libdds.so.0
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, sqlite3, mbstring, dom, xml, xmlwriter, curl, fileinfo, openssl, tokenizer, ctype, ffi
          coverage: pcov
          ini-values: pcov.directory=app
          tools: composer:v2

      - run: sudo apt-get update && sudo apt-get install -y libdds0

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: vendor/bin/phpunit --coverage-clover coverage/clover.xml --coverage-html coverage/html

      - name: Check the coverage floor
        run: php scripts/coverage.php coverage/clover.xml

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-html
          path: coverage/html
          if-no-files-found: ignore
